NOT independently audited by the agent that added this dependency (M1-2:
bundled SQLite via rusqlite, design 5.3). 23,729 lines is beyond what this
session reviewed line-by-line; the crate is a long-maintained (gwenn),
widely used safe wrapper over libsqlite3-sys, used here only through the
narrow wkp-sys API (open/open_in_memory + safe query/exec calls) with no
unsafe code written in this workspace. This exemption substitutes for the
"safe-to-deploy" review CODEOWNERS calls for on supply-chain/ and wkp-sys
changes and should be replaced with a real `cargo vet certify` by a human
reviewer before being treated as durable.
"""

