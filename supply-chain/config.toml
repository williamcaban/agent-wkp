[[exemptions.libsqlite3-sys]]
version = "0.38.2"
criteria = "safe-to-deploy"
notes = """
NOT independently audited by the agent that added this dependency (M1-2:
bundled SQLite via rusqlite, design 5.3). This crate is mostly the upstream
SQLite amalgamation (~600k lines) plus its Rust FFI bindings; design 9.3
already accepts that bundling SQLite makes tracking its CVEs our own
responsibility via the SBOM/rescan job, not that every release needs a fresh
line-by-line audit of amalgamated upstream C. Still, this exemption
substitutes for the "safe-to-deploy" review CODEOWNERS calls for on
supply-chain/ and wkp-sys changes and should be replaced with a real
`cargo vet certify` (or a documented decision to trust upstream SQLite's own
provenance/release process instead) by a human reviewer before being
treated as durable.
"""

