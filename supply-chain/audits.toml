
# cargo-vet audits file

[[audits.bitflags]]
who = "William Caban <william.caban@gmail.com>"
criteria = "safe-to-deploy"
delta = "2.11.1 -> 2.13.1"
notes = "Reviewed full diff (1045 lines, 11 files): macro/trait internals (iter.rs, lib.rs, public.rs, traits.rs), new test files, CHANGELOG/README updates. No unsafe code anywhere in the crate (grep confirms zero unsafe-related diff lines), no process/env/filesystem access. bitflags is a pure compile-time bit-manipulation macro crate."

[[audits.cc]]
who = "William Caban <william.caban@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.2.53 -> 1.4.5"
notes = "Reviewed full diff (3041 lines, 14 files). No new unsafe code (one pre-existing unsafe call reordered, no logic change). Substantive changes are compiler-probe environment propagation (rust-lang/cc-rs#1859: forward Build::env, incl. PATH, to cc's own compiler-detection child processes) and target-parsing table updates. No network access, no credential handling. cc is the de facto standard build-dependency for compiling C sources from Rust and is exercised by a very large fraction of the ecosystem."

[[audits.find-msvc-tools]]
who = "William Caban <william.caban@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.1.8 -> 0.1.12"
notes = "Build-time-only helper cc uses to locate MSVC toolchains on Windows; this workspace targets only Linux (musl) and macOS (design/M0 cross-compile scope), so its Windows-specific unsafe blocks (LoadLibraryA, COM ComPtr wrappers) never execute in our build or release binary. Diff is version-bump feature additions to that same Windows-only surface plus changelog/doc updates."

[[audits.pkg-config]]
who = "William Caban <william.caban@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.3.32 -> 0.3.34"
notes = "Reviewed the diff.rs delta: clippy-style cleanups (strip_prefix/strip_suffix instead of manual slicing, removing needless &-refs, removing lazy_static in favor of a const Mutex) and one new opt-in Config field (probe_cflags). No unsafe code, no new capability or dependency behavior."

[[audits.shlex]]
who = "William Caban <william.caban@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.3.0 -> 2.0.1"
notes = "Build-dependency of cc only (not used with untrusted runtime input in this workspace). Diff removes the nul-byte-unsafe deprecated join/quote in favor of try_join/try_quote, documents the already-fixed RUSTSEC-2024-0006 advisory, and adds two new unsafe fns (from_bytes/as_bytes_mut) with documented UTF-8 safety invariants that this workspace never calls. Net effect is a safety improvement."

[[audits.smallvec]]
who = "William Caban <william.caban@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.15.2 -> 1.16.0"
notes = "Reviewed full diff (1458 lines): rustfmt reformatting, doc comment rewrapping, use-statement reordering, and removal of the nightly-only debugger_visualizer feature/tests. Every unsafe-block diff is pure reformatting of pre-existing unsafe code (MaybeUninit::assume_init, from_const_with_len_unchecked) with no logic change. No new unsafe code, no new capability."

