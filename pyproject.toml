[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wkp"
version = "0.1.0"
description = "Workspace Knowledge Protocol — progressive disclosure knowledge index for agent frameworks"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
]

[project.scripts]
wkp = "wkp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wkp"]
include = ["src/wkp/py.typed"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
