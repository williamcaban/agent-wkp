[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-wkp"
version = "0.1.0"
description = "Workspace Knowledge Protocol — progressive disclosure knowledge index for agent frameworks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "William Caban", email = "william.caban@gmail.com" },
]
keywords = [
    "knowledge-graph", "agent", "llm", "progressive-disclosure",
    "sqlite-vec", "semantic-search", "claude-code", "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
embed = ["httpx>=0.27.0"]

[project.urls]
Homepage       = "https://github.com/williamcaban/wkp"
Repository     = "https://github.com/williamcaban/wkp"
Documentation  = "https://github.com/williamcaban/wkp/blob/main/docs/architecture.md"
"Bug Tracker"  = "https://github.com/williamcaban/wkp/issues"
Changelog      = "https://github.com/williamcaban/wkp/releases"

[project.scripts]
wkp = "wkp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wkp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "twine>=5.0",
    "build>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
