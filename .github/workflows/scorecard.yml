# M0-2 (issue #2): OpenSSF Scorecard, publishing results to the repo's
# Security tab. Unlike rust-ci.yml/osv-scanner.yml (which gate PRs),
# Scorecard is informational -- it doesn't fail a PR, it scores the repo's
# overall supply-chain posture (branch protection, pinned dependencies,
# fuzzing, etc.) on a schedule and on push to the default branch.
name: Scorecard supply-chain security

on:
  push:
    branches: [main, v2-rust]
  schedule:
    - cron: "30 1 * * 6" # 01:30 UTC every Saturday

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Scorecard's own documented requirements: read the repo, upload a
      # SARIF file to Security > Code Scanning, and (id-token) mint a
      # Sigstore signature over its own results.
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@42c378ffbb438be29e3e1848d520fb0a8ee1c271 # v3.38.0
        with:
          sarif_file: results.sarif
