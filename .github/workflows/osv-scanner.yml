name: OSV-Scanner

# Design 9.3: "Cross-ecosystem vulnerability match ... including bundled
# SQLite." cargo-audit (rust-ci.yml) checks the RustSec advisory-db, which
# is Rust-crate-specific and can lag on or never carry a C-level SQLite
# CVE; OSV.dev aggregates more broadly (GHSA, NVD, etc.), which is the
# gap PR #24's rusqlite/libsqlite3-sys exemption notes flagged.
#
# Two jobs, using google/osv-scanner-action's own reusable workflows
# (pinned by commit SHA, per CLAUDE.md):
#   - scan-pr: diffs old vs. new Cargo.lock on every PR, fails the check
#     if the PR introduces a newly-known-vulnerable dependency.
#   - scan-scheduled: full scan on push and on a weekly schedule, so a
#     vulnerability disclosed *after* a dependency already merged is still
#     caught (results land in the repo's Security > Code Scanning tab).

on:
  push:
    branches: [main, v2-rust]
  pull_request:
    branches: [main, v2-rust]
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC every Monday

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
      actions: read
      # Required to upload SARIF results to the Security tab.
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5" # v2.5.1
    with:
      scan-args: |-
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5" # v2.5.1
    with:
      scan-args: |-
        -r
        ./
