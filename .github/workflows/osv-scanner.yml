name: OSV-Scanner

# Design 9.3: "Cross-ecosystem vulnerability match ... including bundled
# SQLite." cargo-audit (rust-ci.yml) checks the RustSec advisory-db, which
# is Rust-crate-specific and can lag on or never carry a C-level SQLite
# CVE; OSV.dev aggregates more broadly (GHSA, NVD, etc.), which is the
# gap PR #24's rusqlite/libsqlite3-sys exemption notes flagged.
#
# Two jobs, using google/osv-scanner-action's own reusable workflows
# (pinned by commit SHA, per CLAUDE.md):
#   - scan-pr: diffs old vs. new Cargo.lock on every PR, fails the check
#     if the PR introduces a newly-known-vulnerable dependency.
#   - scan-scheduled: full scan on push and on a weekly schedule, so a
#     vulnerability disclosed *after* a dependency already merged is still
#     caught (results land in the repo's Security > Code Scanning tab).
#
# The pinned commit below (880d9b5...) was tagged v2.5.1 upstream when
# this was written; an accuracy audit later found upstream has since
# moved the v2.5.1 tag to point at a different commit
# (6e4298ebc4db23e847df9b2e2de2939d6f066c67). This pin is unaffected --
# SHA-pinning exists precisely so a moved tag can't silently change what
# CI runs -- but the trailing "# v2.5.1" comment on each `uses:` line
# below is no longer verifiable against that tag today. Left un-repinned
# deliberately: bumping to whatever the tag now points at is a real
# dependency change that deserves its own review, not something to do
# silently while fixing a comment.

on:
  push:
    branches: [main, v2-rust]
  pull_request:
    branches: [main, v2-rust]
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC every Monday

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
      actions: read
      # Required to upload SARIF results to the Security tab.
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5" # v2.5.1 at pin time, see note above
    with:
      scan-args: |-
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5" # v2.5.1 at pin time, see note above
    with:
      scan-args: |-
        -r
        ./
