name: Rust CI

on:
  push:
    branches: [main, v2-rust]
  pull_request:
    branches: [main, v2-rust]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-clippy-test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # M5-1 (wkp-hub's control-plane schema): a real Postgres to prove
    # the schema and queries work against, per design 8.2 -- a service
    # container CI stands up and tears down itself, never a hosted
    # instance (docs/plan/milestones.md's M5 scope notes). Password is
    # this ephemeral container's own throwaway credential, not a real
    # secret.
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_PASSWORD: wkp_hub_ci
          POSTGRES_DB: wkp_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:wkp_hub_ci@localhost:5432/wkp_hub_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # M4-6 (`wkp purge`) shells out to the upstream `git-filter-repo`
      # tool rather than vendoring it (CLAUDE.md: no vendoring a Python
      # dependency) -- it must already be on PATH for that crate's tests
      # to exercise the real thing instead of skipping or mocking it.
      - name: install git-filter-repo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-filter-repo

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  audit-deny-vet:
    name: audit, deny, vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-audit,cargo-deny
      # Not via taiki-e/install-action above: mozilla/cargo-vet's last
      # GitHub release binary is v0.10.0, but v0.10.2 (crates.io-only)
      # fixed reading newer entries (e.g. `trusted-publisher`) that
      # upstream import sources like bytecode-alliance's audits.toml
      # already use -- found the hard way (M5-1): the v0.10.0 binary
      # silently drops ~80 audits it can't parse and reports a much
      # larger, wrong "backlog" as a result, which would have pushed
      # this repo toward blanket-exempting crates that already have
      # real third-party audit coverage. `--locked` for a reproducible
      # build from this crate's own published Cargo.lock.
      - name: install cargo-vet (from crates.io, not the stale GitHub release binary)
        run: cargo install cargo-vet --version 0.10.2 --locked --force

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

      - name: cargo vet check
        run: cargo vet check

  bench:
    name: bench (regression gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo bench -p wkp-core
        run: cargo bench -p wkp-core

      - name: compare against benches/baseline.json
        run: ./benches/compare.sh

  cross-linux-musl:
    name: cross-compile (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: cargo build --release --target x86_64-unknown-linux-musl
        run: cargo build --release --locked -p wkp-cli --target x86_64-unknown-linux-musl

      - name: verify static linking
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/wkp
          file "$BIN"
          # rustc defaults musl targets to static-PIE, where ldd prints
          # "statically linked" and exits 0 (a plain static binary instead
          # prints "not a dynamic executable"); accept either.
          LDD_OUT=$(ldd "$BIN" 2>&1 || true)
          echo "$LDD_OUT"
          if ! echo "$LDD_OUT" | grep -qE "statically linked|not a dynamic executable"; then
            echo "::error::$BIN is dynamically linked; musl builds must be fully static"
            exit 1
          fi

      - name: smoke test
        run: target/x86_64-unknown-linux-musl/release/wkp --version

      - name: size gate (< 10 MB, design 9.6)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/wkp
          SIZE=$(stat -c%s "$BIN")
          LIMIT=$((10 * 1024 * 1024))
          echo "binary size: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::$BIN is $SIZE bytes, over the 10 MB gate (design 9.6)"
            exit 1
          fi

  cross-macos-arm64:
    name: cross-compile (aarch64-apple-darwin)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build --release --target aarch64-apple-darwin
        run: cargo build --release --locked -p wkp-cli --target aarch64-apple-darwin

      - name: smoke test
        run: target/aarch64-apple-darwin/release/wkp --version

      - name: size gate (< 10 MB, design 9.6)
        run: |
          BIN=target/aarch64-apple-darwin/release/wkp
          SIZE=$(stat -f%z "$BIN")
          LIMIT=$((10 * 1024 * 1024))
          echo "binary size: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::$BIN is $SIZE bytes, over the 10 MB gate (design 9.6)"
            exit 1
          fi

  semgrep:
    name: semgrep (rust ruleset)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 # 1.176.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: semgrep --config p/rust
        run: semgrep scan --config p/rust --error --metrics=off

  hub-mtls-integration:
    name: hub HTTPS+mTLS integration test (M5-13)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # M5-13 (ADR-0011): the milestone's exit-criterion test, replacing
    # the SSH-path integration test this job's own predecessor
    # (`hub-ssh-integration`) ran, now removed by #125 (ADR-0011: SSH
    # transport dropped entirely; kept side by side with the mTLS path
    # here only until this test proved green, per #125's own
    # sequencing requirement). Same Postgres service container the
    # other jobs use, for the same reason.
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_PASSWORD: wkp_hub_ci
          POSTGRES_DB: wkp_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:wkp_hub_ci@localhost:5432/wkp_hub_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This job needs a real `wkp` (not just `wkp-hub`) on the runner
      # itself: `test-mtls-integration.sh` drives the real RFC 8628 +
      # CSR enrollment flow via the actual CLI a device would use, not
      # an admin-CLI bypass, so it has to run outside the container,
      # against the container's own mapped HTTPS port.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build --release -p wkp-cli
        run: cargo build --release -p wkp-cli

      # Rootless podman -- `ubuntu-latest` ships it already, this just
      # confirms it rather than reinstalling.
      - name: confirm podman is available
        run: podman --version

      - name: podman build -f deploy/hub/Containerfile
        run: podman build -f deploy/hub/Containerfile -t wkp-hub .

      # M5-13's own required integration test: register a device over
      # the real CSR flow, push and fetch over HTTPS with mutual TLS,
      # revoke it, attempt another push, confirm it fails at the TLS
      # handshake itself.
      - name: deploy/hub/test-mtls-integration.sh
        env:
          WKP_BIN: ${{ github.workspace }}/target/release/wkp
        run: bash deploy/hub/test-mtls-integration.sh

  hub-pod-isolation:
    name: hub per-tenant pod isolation test (M5-7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # M5-7 (#110)'s own two still-open acceptance criteria: a real
    # tenant pod reachable by its container-runtime DNS alias (not
    # just intra-pod localhost), and a real cross-tenant filesystem
    # isolation check ("not just the application-level path
    # restriction M5-4 already has"). Both scripts run `wkp-hub`
    # directly on the runner (not inside a container) -- unlike
    # `hub-mtls-integration` above, neither needs the HTTPS front door
    # itself, only real podman/network access. Same Postgres service
    # container the other jobs use, for the same reason.
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_PASSWORD: wkp_hub_ci
          POSTGRES_DB: wkp_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:wkp_hub_ci@localhost:5432/wkp_hub_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build --release -p wkp-hub
        run: cargo build --release -p wkp-hub

      # Rootless podman -- `ubuntu-latest` ships it already, this just
      # confirms it rather than reinstalling.
      - name: confirm podman is available
        run: podman --version

      - name: podman build -f deploy/hub/Containerfile
        run: podman build -f deploy/hub/Containerfile -t wkp-hub .

      - name: deploy/hub/test-pod-lifecycle.sh
        env:
          WKP_HUB_BIN: ${{ github.workspace }}/target/release/wkp-hub
        run: bash deploy/hub/test-pod-lifecycle.sh

      - name: deploy/hub/test-cross-tenant-isolation.sh
        env:
          WKP_HUB_BIN: ${{ github.workspace }}/target/release/wkp-hub
        run: bash deploy/hub/test-cross-tenant-isolation.sh
