name: Rust CI

on:
  push:
    branches: [main, v2-rust]
  pull_request:
    branches: [main, v2-rust]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-clippy-test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # M5-1 (wkp-hub's control-plane schema): a real Postgres to prove
    # the schema and queries work against, per design 8.2 -- a service
    # container CI stands up and tears down itself, never a hosted
    # instance (docs/plan/milestones.md's M5 scope notes). Password is
    # this ephemeral container's own throwaway credential, not a real
    # secret.
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94 # 16
        env:
          POSTGRES_PASSWORD: wkp_hub_ci
          POSTGRES_DB: wkp_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:wkp_hub_ci@localhost:5432/wkp_hub_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # M4-6 (`wkp purge`) shells out to the upstream `git-filter-repo`
      # tool rather than vendoring it (CLAUDE.md: no vendoring a Python
      # dependency) -- it must already be on PATH for that crate's tests
      # to exercise the real thing instead of skipping or mocking it.
      - name: install git-filter-repo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-filter-repo

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  audit-deny-vet:
    name: audit, deny, vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-audit,cargo-deny,cargo-vet

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

      - name: cargo vet check
        run: cargo vet check

  bench:
    name: bench (regression gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo bench -p wkp-core
        run: cargo bench -p wkp-core

      - name: compare against benches/baseline.json
        run: ./benches/compare.sh

  cross-linux-musl:
    name: cross-compile (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: cargo build --release --target x86_64-unknown-linux-musl
        run: cargo build --release --locked -p wkp-cli --target x86_64-unknown-linux-musl

      - name: verify static linking
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/wkp
          file "$BIN"
          # rustc defaults musl targets to static-PIE, where ldd prints
          # "statically linked" and exits 0 (a plain static binary instead
          # prints "not a dynamic executable"); accept either.
          LDD_OUT=$(ldd "$BIN" 2>&1 || true)
          echo "$LDD_OUT"
          if ! echo "$LDD_OUT" | grep -qE "statically linked|not a dynamic executable"; then
            echo "::error::$BIN is dynamically linked; musl builds must be fully static"
            exit 1
          fi

      - name: smoke test
        run: target/x86_64-unknown-linux-musl/release/wkp --version

      - name: size gate (< 10 MB, design 9.6)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/wkp
          SIZE=$(stat -c%s "$BIN")
          LIMIT=$((10 * 1024 * 1024))
          echo "binary size: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::$BIN is $SIZE bytes, over the 10 MB gate (design 9.6)"
            exit 1
          fi

  cross-macos-arm64:
    name: cross-compile (aarch64-apple-darwin)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
        with:
          toolchain: "1.98.1" # keep in sync with rust-toolchain.toml
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build --release --target aarch64-apple-darwin
        run: cargo build --release --locked -p wkp-cli --target aarch64-apple-darwin

      - name: smoke test
        run: target/aarch64-apple-darwin/release/wkp --version

      - name: size gate (< 10 MB, design 9.6)
        run: |
          BIN=target/aarch64-apple-darwin/release/wkp
          SIZE=$(stat -f%z "$BIN")
          LIMIT=$((10 * 1024 * 1024))
          echo "binary size: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::$BIN is $SIZE bytes, over the 10 MB gate (design 9.6)"
            exit 1
          fi

  semgrep:
    name: semgrep (rust ruleset)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 # 1.176.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: semgrep --config p/rust
        run: semgrep scan --config p/rust --error --metrics=off
