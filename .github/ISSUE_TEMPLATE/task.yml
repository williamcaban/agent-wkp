name: Task
description: A unit of work an agent or human can complete in one PR
labels: ["task"]
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: M1
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: Design sections
      description: Section numbers in docs/design/wkp-hub-design-v0.1.md this task implements
      placeholder: "5.3, 5.4"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph. What exists after this task that did not before.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each line must be checkable by a command, a test name, or a benchmark number. Copy into the PR description.
      placeholder: |
        - [ ] `cargo test -p wkp-core frontmatter::` passes with the new fields
        - [ ] fuzz target `frontmatter` runs 10 minutes without a crash
        - [ ] cold `wkp search` p50 < 10 ms on the 50k fixture
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this task must not touch, so the PR stays small.
  - type: dropdown
    id: cosign
    attributes:
      label: Human co-sign required
      options:
        - "No"
        - "Yes (touches a CODEOWNERS path)"
    validations:
      required: true
