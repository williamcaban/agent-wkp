[package]
name = "wkp-hub"
description = "wkp hub mode: wkp-shell, tenant mapping, indexer, control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wkp-hub"
path = "src/main.rs"

[dependencies]
# M5-4: the tenant indexer reuses wkp-core's own frontmatter parser and
# index builder rather than reimplementing them (CLAUDE.md's slim-core
# rule, design 3.3) -- the same reuse contract this crate's own module
# doc for `tenant_repo` names explicitly.
wkp-core = { path = "../wkp-core" }
# M5-4: bare-repo provisioning and reading pushed blob content both go
# through this crate's plumbing wrapper (CLAUDE.md: no `Command::new("git")`
# outside `wkp-git`), exactly like `wkp-cli` does.
wkp-git = { path = "../wkp-git" }
# M5-4: `wkp_crypto::AGE_HEADER`, the same age-ciphertext detection
# `wkp-cli`'s filter (M4-4) uses, needed here so the tenant indexer never
# parses a `visibility: private` blob's ciphertext as if it were plaintext
# markdown. No encrypt/decrypt call in this crate -- the hub never holds a
# device's decryption key (design 8's whole point).
wkp-crypto = { path = "../wkp-crypto" }
# M5-1: the control plane's Postgres client (design 8.2). The
# synchronous `postgres` crate, not `tokio-postgres`/`sqlx` directly --
# every other crate in this workspace is deliberately blocking (git
# subprocesses, rusqlite), and this keeps `wkp-hub`'s own code in that
# same style rather than pulling an async runtime into its call sites
# at this stage; `postgres` still uses `tokio` internally, but only as
# a private implementation detail behind a fully blocking public API.
# Revisit if M5-2's HTTP server needs real request concurrency this
# can't provide. `with-time-0_3` maps `TIMESTAMPTZ` (this schema's
# `revoked_at`, `created_at`) to a real `time::OffsetDateTime` instead
# of hand-parsing a raw string.
postgres = { version = "0.19.14", features = ["with-time-0_3"] }
# M5-2: request/response bodies for the RFC 8628 device-authorization
# endpoints (design 6.4). A well-vetted library, not a hand-rolled
# parser: this parses untrusted network input, unlike promote.rs's
# small, local, trusted TOML config.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3"
# M5-2: the RFC 8628 endpoints and `/verify` page (design 6.4, 8.1).
# Synchronous, not an async web framework -- matches `postgres`'s own
# blocking choice above; a handful of low-traffic, infrequent-by-nature
# endpoints has no real concurrency need an async framework would
# justify.
tiny_http = "0.12.0"

[dev-dependencies]
# M5-2's own test suite drives this crate's HTTP endpoints over a real
# socket (crates/wkp-hub/src/http.rs's own tests), not by calling
# handler functions directly -- `default-features = false`: see
# wkp-cli/Cargo.toml's identical ureq entry for why (CDLA-Permissive-2.0
# license on the TLS stack's `webpki-roots`, and no `https://` target
# this milestone's scope needs anyway).
ureq = { version = "3.4.1", default-features = false, features = ["json", "gzip"] }
# M5-4: `tenant_repo`'s own tests and `tests/post_receive_hook.rs` need a
# real per-test temp directory -- `tempfile::TempDir`, not
# `std::env::temp_dir()` + a hand-rolled unique name, per this repo's own
# semgrep gate and the identical choice `wkp-git`/`wkp-cli`'s test
# fixtures already make (see their `test_support.rs` module docs).
tempfile = "3.27.0"
