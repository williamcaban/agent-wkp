[workspace]
resolver = "2"
members = [
    "crates/wkp-core",
    "crates/wkp-crypto",
    "crates/wkp-git",
    "crates/wkp-cli",
    "crates/wkp-hub",
    "crates/wkp-sys",
    "tests/injection-corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["William Caban <william.caban@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/williamcaban/agent-wkp"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
